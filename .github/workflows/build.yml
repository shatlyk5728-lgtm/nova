name: Nova Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Create platforms
        run: flutter create --platforms=android,windows --project-name nova --org com.nova .

      - name: Patch Android project (Desugaring, SDKs, JitPack)
        shell: bash
        run: |
          echo "==> Patching Android build files for flutter_sing_box..."

          # 1. Add JitPack repository to root build.gradle.kts (or build.gradle)
          FILE="android/build.gradle.kts"
          if [ -f "$FILE" ]; then
            if ! grep -q "jitpack.io" "$FILE"; then
              if grep -q "repositories {" "$FILE"; then
                sed -i 's|mavenCentral()|mavenCentral()\n        maven { url = uri("https://jitpack.io") }|' "$FILE"
              else
                printf '\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n        maven { url = uri("https://jitpack.io") }\n    }\n}\n' >> "$FILE"
              fi
            fi
          elif [ -f "android/build.gradle" ]; then
            if ! grep -q "jitpack.io" "android/build.gradle"; then
              sed -i 's|mavenCentral()|mavenCentral()\n        maven { url "https://jitpack.io" }|' "android/build.gradle"
            fi
          fi

          # 2. Patch Kotlin DSL: android/app/build.gradle.kts
          APP_KTS="android/app/build.gradle.kts"
          if [ -f "$APP_KTS" ]; then
            # compileSdk 37 — required by flutter_sing_box dependencies and androidx.core 1.17.0
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' "$APP_KTS"
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' "$APP_KTS"

            # minSdk 23 + multiDex (required by flutter_sing_box)
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23\n        multiDexEnabled = true/' "$APP_KTS"

            # Enable core library desugaring
            if ! grep -q "isCoreLibraryDesugaringEnabled" "$APP_KTS"; then
              sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' "$APP_KTS"
            fi

            # desugar_jdk_libs 2.1.5 — minimum required by flutter_sing_box
            if ! grep -q "desugar_jdk_libs" "$APP_KTS"; then
              printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n' >> "$APP_KTS"
            fi
            echo "Successfully patched $APP_KTS"
          fi

          # 3. Patch Groovy DSL: android/app/build.gradle (if used)
          APP_GROOVY="android/app/build.gradle"
          if [ -f "$APP_GROOVY" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 37/' "$APP_GROOVY"
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/' "$APP_GROOVY"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23\n        multiDexEnabled true/' "$APP_GROOVY"

            if ! grep -q "coreLibraryDesugaringEnabled" "$APP_GROOVY"; then
              sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' "$APP_GROOVY"
            fi
            if ! grep -q "desugar_jdk_libs" "$APP_GROOVY"; then
              printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"\n}\n' >> "$APP_GROOVY"
            fi
            echo "Successfully patched $APP_GROOVY"
          fi

          # 4. Set App Label in AndroidManifest
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Nova"/' android/app/src/main/AndroidManifest.xml
          fi

          # 5. Verification
          echo "==> Verification:"
          grep -n -E "compileSdk|targetSdk|minSdk|isCoreLibraryDesugaringEnabled|coreLibraryDesugaring|jitpack" "$APP_KTS" "$FILE" 2>/dev/null || true

      - name: Generate source icon
        run: |
          npm install --no-save sharp
          node tools/make_icon.js

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            grep -n -A 15 -E "What went wrong|Could not (resolve|find|get)|FAILURE:|Searched in|Error:" build.log | head -150 || tail -n 80 build.log
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platforms
        run: flutter create --platforms=android,windows --project-name nova --org com.nova .

      - name: Generate source icon
        shell: bash
        run: |
          npm install --no-save sharp
          node tools/make_icon.js

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Windows EXE
        run: flutter build windows --release

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
