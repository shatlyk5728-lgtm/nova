name: Nova Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Create platforms
        run: flutter create --platforms=android,windows --project-name nova --org com.nova .

      - name: Set Android app name
        run: sed -i 's/android:label="[^"]*"/android:label="Nova"/' android/app/src/main/AndroidManifest.xml

      - name: Generate source icon
        run: |
          npm install --no-save sharp
          node tools/make_icon.js

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Precache Android artifacts
        run: flutter precache --android

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        shell: bash
        run: |
          grep -n -A 15 -E "What went wrong|Could not (resolve|find|get)|FAILURE:" build.log | head -120

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Create platforms
        run: flutter create --platforms=android,windows --project-name nova --org com.nova .

      - name: Generate source icon
        run: |
          npm install --no-save sharp
          node tools/make_icon.js

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Windows EXE
        run: flutter build windows --release

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Windows
          path: build/windows/x64/runner/Release/
