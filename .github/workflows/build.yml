
name: Nova Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create --platforms=android --project-name nova --org com.nova .
      - run: sed -i 's/android:label="[^"]*"/android:label="Nova"/' android/app/src/main/AndroidManifest.xml
      - run: npm install --no-save sharp
      - run: node tools/make_icon.js
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create --platforms=windows --project-name nova --org com.nova .
      - run: (Get-Content windows/runner/main.cpp) -replace 'L"nova"', 'L"Nova"' | Set-Content windows/runner/main.cpp
      - run: npm install --no-save sharp
      - run: node tools/make_icon.js
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/windows/x64/runner/Release/
