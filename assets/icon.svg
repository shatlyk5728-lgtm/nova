<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#3A2A9C"/>
      <stop offset="0.55" stop-color="#171350"/>
      <stop offset="1" stop-color="#07071F"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7DF9FF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7B5CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BDF6FF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- orbit ring with a gap: the "tunnel" -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="820 123" transform="rotate(-40 256 256)"/>

  <!-- four-point nova star -->
  <path fill="url(#star)"
        d="M256 96 C266 200 312 246 416 256 C312 266 266 312 256 416 C246 312 200 266 96 256 C200 246 246 200 256 96 Z"/>

  <!-- node on the orbit -->
  <circle cx="378" cy="150" r="16" fill="#7DF9FF"/>
  <circle cx="378" cy="150" r="30" fill="#7DF9FF" opacity="0.18"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
