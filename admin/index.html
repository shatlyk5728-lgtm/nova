<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nova — Админ-панель</title>
<style>
:root{--bg:#070a12;--card:rgba(22,30,50,.72);--card2:#1b2540;--line:#2a3658;--text:#eaf0ff;--muted:#8d9ac0;--a1:#7c5cff;--a2:#2ee6c5;--ok:#35d49a;--warn:#f5a524;--danger:#ff5d73}
[data-theme=light]{--bg:#f2f5fc;--card:rgba(255,255,255,.88);--card2:#eef2fb;--line:#d5ddf0;--text:#15203b;--muted:#64709a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(900px 500px at 8% -10%,rgba(124,92,255,.25),transparent),radial-gradient(800px 500px at 100% 0,rgba(46,230,197,.14),transparent),var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-style:normal;color:#fff}
.wrap{max-width:1040px;margin:22px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;backdrop-filter:blur(10px)}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(124,92,255,.2)}
textarea{min-height:140px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--a1),#5b8cff);transition:.15s}
button:hover{transform:translateY(-1px);filter:brightness(1.1)}
button.g{background:var(--card2);color:var(--text);border:1px solid var(--line)}
button.d{background:var(--danger)}
button.s{padding:6px 10px;font-size:12px}
button:disabled{opacity:.5;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 200px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat b{display:block;font-size:26px;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--muted);font-size:12.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input{flex:2 1 220px}.bar select{flex:1 1 130px}.bar button{flex:0 0 auto}
.bulk{display:none;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--a1);border-radius:12px;padding:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.bulk.on{display:flex}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:.15s}
.item:hover{border-color:var(--a1)}.item.off{opacity:.55}
.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--a1)}
.flag{font-size:30px}
.info b{display:block;font-size:15px}.info small{color:var(--muted)}
.cfg{grid-column:2/-1;font:12px ui-monospace,Menlo,monospace;color:var(--muted);background:var(--card2);border-radius:8px;padding:6px 10px;word-break:break-all}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(124,92,255,.16);color:var(--a1);font-weight:700;margin-left:6px;vertical-align:middle}
.act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{text-align:center;color:var(--muted);padding:50px 0}
.sk{height:62px;border-radius:14px;background:linear-gradient(90deg,var(--card2),var(--line),var(--card2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbg.open{display:flex}.modal{width:100%;max-width:620px;max-height:92vh;overflow:auto}
.modal h2{margin:0}.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}.hint.w{color:var(--warn)}
.ck{display:flex;align-items:center;gap:8px;margin-top:14px}.ck input{width:auto}.ck label{margin:0;color:var(--text)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;display:none;z-index:20;background:var(--card2);border:1px solid var(--ok);color:var(--ok)}
#toast.err{border-color:var(--danger);color:var(--danger)}
.login{max-width:380px;margin:90px auto}.hid{display:none!important}
@media(max-width:640px){.item{grid-template-columns:auto 1fr}.item .badge-col,.act{grid-column:1/-1;justify-content:flex-start}.cfg{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <div class="logo"><i>N</i>Nova · Админ</div>
  <div style="display:flex;gap:8px;align-items:center">
    <small id="ue" class="hid" style="color:var(--muted)"></small>
    <button class="g s" id="themeBtn" title="Тема">◐</button>
    <button class="g s hid" id="out">Выйти</button>
  </div>
</header>

<div id="lv" class="card login hid">
  <h2 style="margin:0">Вход</h2>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Пароль</label><input id="pw" type="password" autocomplete="current-password">
  <div class="ck"><input type="checkbox" id="sp"><label for="sp">Показать пароль</label></div>
  <div class="foot"><button id="go" style="width:100%">Войти</button></div>
</div>

<div id="av" class="wrap hid">
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input id="q" placeholder="Поиск… (нажмите /)">
    <select id="fp"><option value="">Все протоколы</option><option>vless</option><option>vmess</option><option>shadowsocks</option><option>hysteria2</option><option>trojan</option></select>
    <select id="fs"><option value="">Любой статус</option><option value="on">Активные</option><option value="off">Отключённые</option></select>
    <select id="so"><option value="new">Сначала новые</option><option value="name">По названию</option><option value="country">По стране</option></select>
  </div>
  <div class="bar">
    <button id="add">+ Сервер (N)</button>
    <button class="g" id="imp">Импорт ссылок</button>
    <button class="g" id="exp">Экспорт JSON</button>
    <button class="g" onclick="$('ij').click()">Импорт JSON</button>
    <input type="file" id="ij" accept=".json" class="hid">
    <label style="margin:0;display:flex;gap:6px;align-items:center;margin-left:auto"><input type="checkbox" id="all" style="width:auto">Выбрать все</label>
  </div>
  <div class="bulk" id="bulk"><b id="bc"></b>
    <button class="g s" id="b-on">Включить</button><button class="g s" id="b-off">Выключить</button>
    <button class="d s" id="b-del">Удалить</button><button class="g s" id="b-x">Снять выбор</button>
  </div>
  <div class="list" id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</div>

<div class="mbg" id="fm"><div class="card modal">
  <h2 id="ft">Новый сервер</h2>
  <div class="row"><div><label>Название</label><input id="fn" placeholder="Germany #1"></div><div><label>Страна</label><input id="fc" placeholder="Germany"></div></div>
  <div class="row"><div><label>Флаг</label><input id="ff" maxlength="8" placeholder="🇩🇪"></div>
  <div><label>Протокол</label><select id="fpr"><option value="vless">VLESS</option><option value="vmess">VMess</option><option value="shadowsocks">Shadowsocks</option><option value="hysteria2">Hysteria2</option><option value="trojan">Trojan</option></select></div></div>
  <label>Конфигурация (ссылка или JSON) — протокол определится сам</label>
  <textarea id="fcf" spellcheck="false" placeholder="vless://uuid@host:443?..."></textarea><div id="fh" class="hint"></div>
  <label>Заметка (видна только админу)</label><input id="fno">
  <div class="ck"><input type="checkbox" id="fa" checked><label for="fa">Сервер активен</label></div>
  <div class="foot"><button class="g" data-close>Отмена</button><button id="sv">Сохранить</button></div>
</div></div>

<div class="mbg" id="im"><div class="card modal">
  <h2>Импорт ссылок</h2><div class="hint">По одной ссылке на строку. Название берётся из #фрагмента, флаг — из эмодзи в названии.</div>
  <textarea id="it" style="min-height:220px" placeholder="vless://...#🇩🇪 Germany&#10;trojan://...#🇳🇱 Netherlands"></textarea>
  <div class="foot"><button class="g" data-close>Отмена</button><button id="ig">Импортировать</button></div>
</div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://YOUR-PROJECT.supabase.co',SUPABASE_ANON_KEY='YOUR_ANON_PUBLIC_KEY'; // только anon-ключ!
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),T='vpn_server_configs',$=i=>document.getElementById(i);
let S=[],sel=new Set(),shown=new Set(),eid=null;
const PR={vless:['vless://'],vmess:['vmess://'],shadowsocks:['ss://'],hysteria2:['hysteria2://','hy2://'],trojan:['trojan://']};
const FL={germany:'🇩🇪',netherlands:'🇳🇱',usa:'🇺🇸','united states':'🇺🇸',uk:'🇬🇧','united kingdom':'🇬🇧',france:'🇫🇷',finland:'🇫🇮',sweden:'🇸🇪',poland:'🇵🇱',turkey:'🇹🇷',japan:'🇯🇵',singapore:'🇸🇬',canada:'🇨🇦',russia:'🇷🇺',kazakhstan:'🇰🇿',latvia:'🇱🇻',estonia:'🇪🇪',switzerland:'🇨🇭',india:'🇮🇳',uae:'🇦🇪'};
const RF=/[\u{1F1E6}-\u{1F1FF}]{2}/u;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const detect=t=>{t=t.trim().toLowerCase();for(const[k,v]of Object.entries(PR))if(v.some(p=>t.startsWith(p)))return k;return null};
const ago=d=>{const s=(new Date(d)-Date.now())/1000,r=new Intl.RelativeTimeFormat('ru',{numeric:'auto'});for(const[u,n]of[['day',86400],['hour',3600],['minute',60]])if(Math.abs(s)>=n)return r.format(Math.round(s/n),u);return 'только что'};
const now=()=>new Date().toISOString();
function toast(m,t){const e=$('toast');e.textContent=m;e.className=t||'';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
const scr=v=>{$('lv').classList.toggle('hid',v!=='l');$('av').classList.toggle('hid',v!=='a');$('ue').classList.toggle('hid',v!=='a');$('out').classList.toggle('hid',v!=='a')};
try{const t=localStorage.getItem('nova-theme');if(t)document.documentElement.dataset.theme=t}catch{}
$('themeBtn').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('nova-theme',n)}catch{}};

/* Авторизация */
async function boot(){const{data:{session}}=await db.auth.getSession();if(!session)return scr('l');
 const{data}=await db.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();
 if(!data?.is_admin){await db.auth.signOut();toast('Нет прав администратора','err');return scr('l')}
 $('ue').textContent=session.user.email;scr('a');load()}
$('go').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)return toast(error.message,'err');boot()};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('sp').onchange=e=>$('pw').type=e.target.checked?'text':'password';
$('out').onclick=async()=>{await db.auth.signOut();scr('l')};

/* Данные и отображение */
async function load(){const{data,error}=await db.from(T).select('*');if(error)return toast(error.message,'err');S=data||[];sel.clear();render()}
function view(){const q=$('q').value.trim().toLowerCase(),p=$('fp').value,st=$('fs').value;
 const r=S.filter(s=>(!q||[s.name,s.country,s.protocol,s.note].some(v=>String(v||'').toLowerCase().includes(q)))&&(!p||s.protocol===p)&&(!st||(st==='on')===s.is_active));
 const c={new:(a,b)=>b.created_at.localeCompare(a.created_at),name:(a,b)=>a.name.localeCompare(b.name),country:(a,b)=>a.country.localeCompare(b.country)}[$('so').value];return r.sort(c)}
function render(){
 const on=S.filter(s=>s.is_active).length;
 $('stats').innerHTML=[['Всего',S.length],['Активных',on],['Отключённых',S.length-on],['Стран',new Set(S.map(s=>s.country)).size],['Протоколов',new Set(S.map(s=>s.protocol)).size]].map(([l,v])=>`<div class="card stat"><b>${v}</b><span>${l}</span></div>`).join('');
 const r=view();
 $('list').innerHTML=r.length?r.map(s=>`<div class="item ${s.is_active?'':'off'}" data-id="${esc(s.id)}">
  <input type="checkbox" ${sel.has(s.id)?'checked':''}><div class="flag">${esc(s.flag||'🌐')}</div>
  <div class="info"><b>${esc(s.name)}<span class="badge">${esc(s.protocol)}</span></b><small>${esc(s.country)} · ${s.is_active?'активен':'отключён'} · обновлён ${ago(s.updated_at)}${s.note?' · '+esc(s.note):''}</small></div>
  <div class="act"><button class="g s" data-a="copy">Копировать</button><button class="g s" data-a="show">${shown.has(s.id)?'Скрыть':'Показать'}</button><button class="g s" data-a="dup">Дубль</button><button class="g s" data-a="edit">Изменить</button><button class="g s" data-a="tg">${s.is_active?'Выкл':'Вкл'}</button><button class="d s" data-a="del">Удалить</button></div>
  <div class="cfg">${esc(shown.has(s.id)?s.config_text:s.config_text.slice(0,24)+'••••••••••')}</div></div>`).join(''):'<div class="empty">Ничего не найдено</div>';
 $('bulk').classList.toggle('on',sel.size>0);$('bc').textContent=`Выбрано: ${sel.size}`;$('all').checked=r.length>0&&r.every(s=>sel.has(s.id))}
['q','fp','fs','so'].forEach(i=>$(i).oninput=render);
$('all').onchange=e=>{view().forEach(s=>e.target.checked?sel.add(s.id):sel.delete(s.id));render()};
$('list').onchange=e=>{const id=e.target.closest('.item')?.dataset.id;if(!id)return;e.target.checked?sel.add(id):sel.delete(id);render()};
$('list').onclick=async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const id=b.closest('.item').dataset.id,s=S.find(x=>x.id===id),a=b.dataset.a;
 if(a==='copy'){try{await navigator.clipboard.writeText(s.config_text);toast('Скопировано')}catch{toast('Не удалось скопировать','err')}}
 else if(a==='show'){shown.has(id)?shown.delete(id):shown.add(id);render()}
 else if(a==='edit')openForm(s);
 else if(a==='dup'){const{id:_,created_at,updated_at,...c}=s;const{error}=await db.from(T).insert({...c,name:s.name+' (копия)'});error?toast(error.message,'err'):(toast('Дубликат создан'),load())}
 else if(a==='tg'){const{error}=await db.from(T).update({is_active:!s.is_active,updated_at:now()}).eq('id',id);error?toast(error.message,'err'):load()}
 else if(a==='del'&&confirm(`Удалить «${s.name}»?`)){const{error}=await db.from(T).delete().eq('id',id);error?toast(error.message,'err'):(toast('Удалено'),load())}};

/* Массовые действия */
async function bulk(f,m){const{error}=await f([...sel]);if(error)return toast(error.message,'err');toast(m);load()}
$('b-on').onclick=()=>bulk(i=>db.from(T).update({is_active:true,updated_at:now()}).in('id',i),'Включено');
$('b-off').onclick=()=>bulk(i=>db.from(T).update({is_active:false,updated_at:now()}).in('id',i),'Выключено');
$('b-del').onclick=()=>confirm(`Удалить выбранные (${sel.size})?`)&&bulk(i=>db.from(T).delete().in('id',i),'Удалено');
$('b-x').onclick=()=>{sel.clear();render()};

/* Форма */
const closeAll=()=>document.querySelectorAll('.mbg').forEach(m=>m.classList.remove('open'));
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
document.querySelectorAll('.mbg').forEach(m=>m.onmousedown=e=>{if(e.target===m)closeAll()});
function openForm(s){eid=s?s.id:null;$('ft').textContent=s?'Редактирование':'Новый сервер';
 $('fn').value=s?.name||'';$('fc').value=s?.country||'';$('ff').value=s?.flag||'';$('fpr').value=s?.protocol||'vless';$('fcf').value=s?.config_text||'';$('fno').value=s?.note||'';$('fa').checked=s?s.is_active:true;hint();$('fm').classList.add('open')}
function hint(){const t=$('fcf').value.trim(),h=$('fh');h.className='hint';if(!t)return h.textContent='';
 if(/^[\[{]/.test(t)){try{JSON.parse(t);h.textContent='JSON корректный'}catch{h.textContent='Ошибка синтаксиса JSON';h.className='hint w'}return}
 const ok=detect(t)===$('fpr').value;h.textContent=ok?'Формат соответствует протоколу':'Префикс не совпадает с выбранным протоколом';if(!ok)h.className='hint w'}
$('fcf').oninput=()=>{const d=detect($('fcf').value);if(d)$('fpr').value=d;hint()};$('fpr').onchange=hint;
$('fc').onblur=()=>{const f=FL[$('fc').value.trim().toLowerCase()];if(f&&!$('ff').value||$('ff').value==='🌐'&&f)$('ff').value=f};
$('add').onclick=()=>openForm();
$('sv').onclick=async()=>{const p={name:$('fn').value.trim(),country:$('fc').value.trim(),flag:$('ff').value.trim()||'🌐',protocol:$('fpr').value,config_text:$('fcf').value.trim(),note:$('fno').value.trim(),is_active:$('fa').checked,updated_at:now()};
 if(!p.name||!p.country||!p.config_text)return toast('Заполните название, страну и конфигурацию','err');
 $('sv').disabled=true;const{error}=eid?await db.from(T).update(p).eq('id',eid):await db.from(T).insert(p);$('sv').disabled=false;
 if(error)return toast(error.message+' (выполнили step2_upgrade.sql?)','err');toast('Сохранено');closeAll();load()};

/* Импорт / экспорт */
$('imp').onclick=()=>{$('it').value='';$('im').classList.add('open')};
$('ig').onclick=async()=>{const lines=$('it').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
 const rows=lines.map((l,i)=>{const pr=detect(l);if(!pr)return null;let n='';const h=l.indexOf('#');if(h>0)try{n=decodeURIComponent(l.slice(h+1))}catch{}
  const fl=(n.match(RF)||[])[0]||'🌐',c=n.replace(RF,'').trim().split(/[\s\-_|#]/)[0]||'Unknown';
  return{name:n||`${pr} ${i+1}`,country:c,flag:fl,protocol:pr,config_text:l,is_active:true}}).filter(Boolean);
 if(!rows.length)return toast('Не найдено ни одной корректной ссылки','err');
 const{error}=await db.from(T).insert(rows);if(error)return toast(error.message,'err');
 toast(`Импортировано: ${rows.length}`+(lines.length>rows.length?`, пропущено: ${lines.length-rows.length}`:''));closeAll();load()};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=`nova-servers-${now().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};
$('ij').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const rows=JSON.parse(await f.text()).map(({name,country,flag,protocol,config_text,is_active,note})=>({name,country,flag,protocol,config_text,note,is_active:is_active!==false})).filter(r=>r.name&&r.country&&r.protocol&&r.config_text);
 const{error}=await db.from(T).insert(rows);if(error)throw error;toast(`Импортировано: ${rows.length}`);load()}catch(x){toast('Ошибка импорта: '+x.message,'err')}e.target.value=''};

/* Горячие клавиши */
addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||$('av').classList.contains('hid'))return;
 if(e.key==='n')openForm();if(e.key==='/'){e.preventDefault();$('q').focus()}});
boot();
</script>
</body>
</html>
